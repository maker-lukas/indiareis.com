backend:
  name: github
  repo: maker-lukas/indiareis.com
  branch: main
  base_url: https://sveltia-cms-auth.itslukasreis.workers.dev

collections:
  - name: artworks
    label: Artworks
    folder: src/content/artworks
    extension: json
    format: json
    create: true
    slug: '{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}-{{slug}}'
    identifier_field: title
    media_folder: /src/assets/artworks
    public_folder: ../../assets/artworks
    fields:
      - { name: title, label: Title, widget: string, required: false }
      - { name: image, label: Image, widget: image }
      - { name: category, label: Type, widget: select, options: [Pencil, Ballpoint, Charcoal, Ink], default: Pencil }
      - { name: year, label: Year, widget: number, value_type: int, default: 2026 }
      - { name: description, label: Description, widget: text, required: false }